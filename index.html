<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心晴 · 记录此刻</title><style>
:root{--bg:#f2e8f5;--ink:#19161c;--muted:#716a75;--line:#e9e3eb;--lime:#d9f44c;--pink:#f4cdf4;--blue:#c9edf5;--shadow:0 22px 60px #563f6017}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Segoe UI","PingFang SC",sans-serif}.shell{width:min(1100px,calc(100% - 30px));margin:auto;padding:20px 0 45px}.top{height:58px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.nav{display:flex;gap:8px}.nav a{text-decoration:none;color:var(--muted);padding:9px 13px;border-radius:999px}.nav a.active{background:#fff;color:var(--ink);font-weight:800}.intro{padding:38px 0 20px}.intro h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.05em;margin:0 0 10px}.intro p{color:var(--muted)}.panel{background:#fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.main{padding:30px}.main h2{font-size:29px;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 22px}.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.mood{border:2px solid transparent;background:#faf8fb;border-radius:18px;padding:12px 5px;cursor:pointer}.mood:hover,.mood[aria-pressed=true]{border-color:var(--c);transform:translateY(-2px)}.icon{width:54px;height:54px;border-radius:17px;background:var(--c);display:grid;place-items:center;font-size:27px;margin:auto auto 7px}.mood b{font-size:13px}.customFace{width:54px;height:54px;border-radius:18px;background:var(--c);margin:auto auto 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:.85}.eyes{letter-spacing:5px}.mouth{font-size:17px}.add{border-style:dashed}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.label{display:block;font-size:13px;font-weight:850;margin:0 0 9px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.level,.chip,.mediaBtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer}.level[aria-pressed=true]{background:var(--lime);font-weight:900}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip[aria-pressed=true]{background:var(--blue)}textarea,input,select{font:inherit}.note,.input{width:100%;border:1px solid var(--line);background:#faf8fb;border-radius:14px;padding:12px}.note{min-height:105px;resize:vertical}.media{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}.status{font-size:12px;color:var(--muted);align-self:center}.preview{display:flex;gap:10px;margin-top:10px}.preview img{width:75px;height:58px;object-fit:cover;border-radius:10px}.preview audio{height:34px;max-width:260px}.actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;background:#fbf9fc;border-top:1px solid var(--line)}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:850;cursor:pointer}.primary{background:var(--lime)}.secondary{background:#fff;border:1px solid var(--line)}.care{display:none;margin-top:22px}.care.show{display:block}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan{border-radius:22px;padding:20px;box-shadow:var(--shadow)}.plan:nth-child(1){background:#eff9c8}.plan:nth-child(2){background:var(--pink)}.plan:nth-child(3){background:var(--blue)}.plan p{color:#615a64;min-height:58px}.done{background:#fff}.done.ok{background:#1b181d;color:#fff}.modal{position:fixed;inset:0;background:#21172380;display:none;place-items:center;padding:18px;z-index:4}.modal.show{display:grid}.dialog{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:24px}.dialogHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f4eff5;border-radius:9px;padding:8px;cursor:pointer}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.rate{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.rate[aria-pressed=true]{background:var(--lime)}.swatches,.parts{display:flex;gap:8px;flex-wrap:wrap}.swatch,.part{border:2px solid transparent;border-radius:11px;width:42px;height:42px;cursor:pointer}.part{width:auto;min-width:45px;background:#f7f3f8}.active{border-color:#171419}.builderPreview{display:grid;place-items:center;padding:15px}.builderPreview .customFace{width:94px;height:94px;font-size:20px}.customList{display:grid;gap:7px;margin-top:15px}.customItem{display:flex;justify-content:space-between;background:#f8f5f9;padding:9px;border-radius:11px}.customItem button{border:0;background:#fff;padding:6px;border-radius:7px}.legal{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:760px){.main{padding:20px 14px}.moods{grid-template-columns:repeat(3,1fr)}.row,.plans{grid-template-columns:1fr}.actions .btn{flex:1}.nav a{padding:8px}}
</style></head><body><main class="shell"><header class="top"><b class="brand">心晴</b><nav class="nav"><a class="active" href="index.html">记录此刻</a><a href="trends.html">情绪趋势</a></nav></header><section class="intro"><h1>今天的心情，是什么颜色？</h1><p>选择最接近的感受，也可以创建只属于你的情绪。</p></section><section class="panel"><div class="main"><h2>选择一种情绪</h2><p class="hint">情绪没有高低之分，它们都在告诉你一些事情。</p><div class="moods" id="moods"></div><div class="row"><div><span class="label">情绪强度</span><div class="levels" id="levels"><button class="level">1</button><button class="level">2</button><button class="level" aria-pressed="true">3</button><button class="level">4</button><button class="level">5</button></div><span class="label" style="margin-top:18px">触发因素</span><div class="chips"><button class="chip">学业</button><button class="chip">工作</button><button class="chip">关系</button><button class="chip">身体状态</button><button class="chip">说不清</button></div></div><div><label class="label">记录具体场景</label><textarea class="note" id="note" placeholder="发生了什么？你当时有什么想法？"></textarea><div class="media"><label class="mediaBtn">上传图片<input id="photo" type="file" accept="image/*" hidden></label><button class="mediaBtn" id="recordBtn">开始录音</button><span class="status" id="status">媒体仅保存在当前浏览器</span></div><div class="preview" id="preview"></div></div></div><p id="error" style="color:#b24550"></p></div><div class="actions"><button class="btn secondary" onclick="location.href='trends.html'">查看情绪趋势</button><button class="btn primary" id="saveBtn">记录此刻</button></div></section><section class="care" id="care"><h2 id="careTitle"></h2><p id="careText"></p><div class="plans" id="plans"></div></section><p class="legal">心晴不是医疗服务。如有伤害自己或他人的念头，请立即联系当地紧急援助或可信任的人。</p></main>
<div class="modal" id="builder"><div class="dialog"><div class="dialogHead"><h2>自定义心情</h2><button class="close" onclick="builder.classList.remove('show')">关闭</button></div><div class="builderPreview" id="builderPreview"></div><label class="label">名称</label><input class="input" id="moodName" placeholder="例如：松了一口气"><p class="label">颜色</p><div class="swatches" id="colors"></div><p class="label">眼睛</p><div class="parts" id="eyes"></div><p class="label">鼻子</p><div class="parts" id="noses"></div><p class="label">嘴巴</p><div class="parts" id="mouths"></div><div class="customList" id="customList"></div><p style="text-align:right"><button class="btn primary" id="saveMood">保存心情</button></p></div></div>
<div class="modal" id="feedback"><div class="dialog"><div class="dialogHead"><h2>做完后，感觉如何？</h2><button class="close" onclick="feedback.classList.remove('show')">关闭</button></div><p id="feedbackAction"></p><span class="label">现在的情绪强度</span><div class="rating" id="rating"><button class="rate">1</button><button class="rate">2</button><button class="rate">3</button><button class="rate">4</button><button class="rate">5</button></div><select class="input" id="change"><option>更轻松了</option><option>有一点改善</option><option>暂时没变化</option><option>感觉更难受</option></select><textarea class="note" id="feedbackNote" placeholder="可以写下具体变化"></textarea><p style="text-align:right"><button class="btn primary" id="saveFeedback">保存反馈</button></p></div></div>
<script>
const $=id=>document.getElementById(id),base=[['开心','😊','#c9f341'],['平静','😌','#a9e7ef'],['期待','😄','#ffd45e'],['感动','🥹','#ffc7dc'],['疲惫','😫','#a9bce9'],['焦虑','😟','#c9b2ee'],['悲伤','😢','#86c7e5'],['愤怒','😠','#ff8067'],['困惑','😕','#a7b5dc'],['满足','☺️','#b9dfa1'],['紧张','😬','#f6b884']];let selected=null,level=3,photo='',audio='',rec,chunks=[],recordId='',action='',after=0,editing='',draft={color:'#a9c8e5',eyes:'••',nose:'·',mouth:'﹏'};const opts={color:['#f7a3ae','#ffb560','#ff8067','#c9d9a9','#a9c8e5','#b8a6d8'],eyes:['••','⌒⌒','＞＜','˘˘'],nose:['','·','•'],mouth:['︶','⌣','﹏','○']};
const customs=()=>JSON.parse(localStorage.getItem('customMoods')||'[]'),face=m=>m.custom?'<div class="customFace" style="--c:'+m.color+'"><span class="eyes">'+m.eyes+'</span><span>'+m.nose+'</span><span class="mouth">'+m.mouth+'</span></div>':'<span class="icon" style="--c:'+m.color+'">'+m.icon+'</span>';
function renderMoods(){const all=[...base.map((x,i)=>({id:'b'+i,name:x[0],icon:x[1],color:x[2]})),...customs()];moods.innerHTML=all.map(m=>'<button class="mood" style="--c:'+m.color+'" data-id="'+m.id+'">'+face(m)+'<b>'+m.name+'</b></button>').join('')+'<button class="mood add" id="add"><span class="icon" style="--c:#eee8f0">＋</span><b>自定义</b></button>';document.querySelectorAll('.mood[data-id]').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.mood').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');selected=all[i]});add.onclick=()=>{editing='';moodName.value='';builder.classList.add('show');renderBuilder()}}
document.querySelectorAll('.level').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.level').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');level=i+1});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')});
function read(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}photo.onchange=e=>{if(e.target.files[0])read(e.target.files[0],x=>{photo=x;preview.innerHTML='<img src="'+x+'">'+(audio?'<audio controls src="'+audio+'"></audio>':'')})};recordBtn.onclick=async()=>{if(rec?.state==='recording'){rec.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{read(new Blob(chunks,{type:'audio/webm'}),x=>{audio=x;preview.innerHTML=(photo?'<img src="'+photo+'">':'')+'<audio controls src="'+audio+'"></audio>'});s.getTracks().forEach(t=>t.stop());recordBtn.textContent='重新录音';status.textContent='录音完成'};rec.start();recordBtn.textContent='停止录音';status.textContent='录音中，最长 60 秒';setTimeout(()=>rec?.state==='recording'&&rec.stop(),60000)}catch(e){status.textContent='请允许浏览器使用麦克风'}};
const plansFor=n=>n==='焦虑'?[['呼吸练习','吸气 4 秒，停留 2 秒，呼气 6 秒。'],['舒缓声音','播放低刺激环境音，让注意力暂时离开担忧。'],['轻柔运动','慢走 5 分钟，留意脚掌与地面的接触。']]:n==='愤怒'?[['释放张力','做 10 次缓慢深蹲或伸展。'],['冷静音乐','选择节奏缓慢、没有歌词的音乐。'],['延迟回应','给自己 10 分钟再决定是否回复。']]:[['一分钟呼吸','慢慢吸气和呼气，留意身体感受。'],['音乐陪伴','选择一段与当下节奏接近的音乐。'],['微小行动','只完成眼前最小的一步。']];
saveBtn.onclick=()=>{if(!selected){error.textContent='请先选择一种情绪。';return}const trigger=[...document.querySelectorAll('.chip')].find(x=>x.getAttribute('aria-pressed')==='true')?.textContent||'未选择',ps=plansFor(selected.name),r={id:'r'+Date.now(),mood:selected.name,face:selected.icon||'',customFace:selected.custom?selected:null,color:selected.color,level,trigger,note:note.value.trim(),timestamp:new Date().toISOString(),photo,audio,plan:{actions:ps.map(x=>({name:x[0],text:x[1]}))},feedback:[]};let d=JSON.parse(localStorage.getItem('moodRecords')||'[]');d.unshift(r);try{localStorage.setItem('moodRecords',JSON.stringify(d.slice(0,30)))}catch(e){r.photo=r.audio='';localStorage.setItem('moodRecords',JSON.stringify(d.slice(0,30)))}recordId=r.id;careTitle.textContent=selected.name+'时，可以先做一件小事';careText.textContent='选择一个适合当下的方案，不需要全部完成。';plans.innerHTML=ps.map((x,i)=>'<article class="plan"><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div><button class="btn done" data-a="'+x[0]+'">我完成了</button></div></article>').join('');document.querySelectorAll('.done').forEach(b=>b.onclick=()=>{action=b.dataset.a;feedbackAction.textContent='行动方案：'+action;feedback.classList.add('show')});care.classList.add('show');care.scrollIntoView({behavior:'smooth'})};
document.querySelectorAll('.rate').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.rate').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');after=i+1});saveFeedback.onclick=()=>{if(!after)return;let d=JSON.parse(localStorage.getItem('moodRecords')||'[]'),r=d.find(x=>x.id===recordId);if(r){r.feedback.push({action,afterLevel:after,change:change.value,note:feedbackNote.value.trim(),completedAt:new Date().toISOString()});localStorage.setItem('moodRecords',JSON.stringify(d))}feedback.classList.remove('show');let b=[...document.querySelectorAll('.done')].find(x=>x.dataset.a===action);b.textContent='已完成';b.classList.add('ok')};
function renderBuilder(){builderPreview.innerHTML=face({...draft,custom:true});colors.innerHTML=opts.color.map(v=>'<button class="swatch '+(draft.color===v?'active':'')+'" style="background:'+v+'" data-k="color" data-v="'+v+'"></button>').join('');[['eyes','eyes'],['noses','nose'],['mouths','mouth']].forEach(([id,k])=>$(id).innerHTML=opts[k].map(v=>'<button class="part '+(draft[k]===v?'active':'')+'" data-k="'+k+'" data-v="'+v+'">'+(v||'无')+'</button>').join(''));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{draft[b.dataset.k]=b.dataset.v;renderBuilder()});customList.innerHTML=customs().map(m=>'<div class="customItem"><span>'+m.name+'</span><span><button onclick="editMood(\''+m.id+'\')">编辑</button> <button onclick="delMood(\''+m.id+'\')">删除</button></span></div>').join('')}
saveMood.onclick=()=>{if(!moodName.value.trim())return;let d=customs(),m={id:editing||'c'+Date.now(),name:moodName.value.trim(),custom:true,...draft};d=editing?d.map(x=>x.id===editing?m:x):[...d,m];localStorage.setItem('customMoods',JSON.stringify(d));builder.classList.remove('show');renderMoods()};function editMood(id){let m=customs().find(x=>x.id===id);editing=id;Object.assign(draft,m);moodName.value=m.name;renderBuilder()}function delMood(id){localStorage.setItem('customMoods',JSON.stringify(customs().filter(x=>x.id!==id)));renderBuilder();renderMoods()}renderMoods();
</script></body></html>
