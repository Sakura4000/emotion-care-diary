</style></head><body><main class="shell"><header class="top"><b class="brand">心晴</b><nav class="nav"><a class="active" href="index.html">记录此刻</a><a href="trends.html">情绪趋势</a></nav></header><section class="intro"><h1>今天的心情，是什么颜色？</h1><p>先认出感受，再决定怎样照顾此刻的自己。</p></section><section class="workspace"><aside class="picker"><div id="pickerView"><h2 class="sectionTitle">选择最接近的情绪</h2><div class="moods" id="moods"></div></div><div class="builder" id="builder"><div class="builderTop"><b>设计一种心情</b><button class="back" id="back">返回</button></div><div class="builderPreview" id="builderPreview"></div><label class="label">给它起个名字</label><input class="input" id="moodName" placeholder="例如：松了一口气"><p class="label">颜色</p><div class="swatches" id="colors"></div><p class="label">眼睛</p><div class="parts" id="eyes"></div><p class="label">鼻子</p><div class="parts" id="noses"></div><p class="label">嘴巴</p><div class="parts" id="mouths"></div><div class="customList" id="customList"></div><button class="btn primary" id="saveMood">保存到情绪列表</button></div></aside><section class="editor"><div class="current"><div class="currentFace" id="currentFace">☁️</div><div><h2 id="currentTitle">先从左边选一种感受</h2><p id="currentCopy">不必找到完全准确的词，接近就很好。</p></div></div><div class="strength"><div class="strengthHead"><span class="label">这种感受有多明显？</span><span class="strengthText" id="strengthText">还没有选择情绪</span></div><input class="range" id="range" type="range" min="1" max="5" value="3" disabled><div class="scaleLabels"><span>轻轻出现</span><span>占满此刻</span></div></div><div class="formGrid"><div><span class="label">是什么触发了它？</span><div class="chips"><button class="chip">学业</button><button class="chip">工作</button><button class="chip">关系</button><button class="chip">身体状态</button><button class="chip">说不清</button></div></div><div><label class="label" for="note">记录具体场景</label><textarea class="note" id="note" placeholder="发生了什么？你当时有什么想法？"></textarea><div class="media"><label class="mediaBtn"><span class="mediaIcon">📷</span><span>记录此刻画面</span><input id="photo" type="file" accept="image/*" hidden></label><button class="mediaBtn" id="recordBtn"><span class="mediaIcon"><i class="mic"></i></span><span id="recordText">记录此刻感受</span></button><span class="status" id="status">图片和声音仅保存在当前浏览器</span></div><div class="preview" id="preview"></div></div></div><p class="error" id="error"></p><div class="actions"><button class="btn secondary" onclick="location.href='trends.html'">查看情绪趋势</button><button class="btn primary" id="saveBtn">记录此刻</button></div></section></section><section class="care" id="care"><h2 id="careTitle"></h2><p id="careText"></p><div class="plans" id="plans"></div></section><p class="legal">心晴不是医疗服务。如有伤害自己或他人的念头，请立即联系当地紧急援助或可信任的人。</p></main>
<div class="modal" id="feedback"><div class="dialog"><div class="dialogHead"><h2>做完后，感觉如何？</h2><button class="close" id="closeFeedback">关闭</button></div><p id="feedbackAction"></p><span class="label">现在的情绪强度</span><div class="rating" id="rating"><button class="rate">1</button><button class="rate">2</button><button class="rate">3</button><button class="rate">4</button><button class="rate">5</button></div><select id="change"><option>更轻松了</option><option>有一点改善</option><option>暂时没变化</option><option>感觉更难受</option></select><textarea class="note" id="feedbackNote" placeholder="可以写下具体变化"></textarea><p style="text-align:right"><button class="btn primary" id="saveFeedback">保存反馈</button></p></div></div>
<script>
const $=id=>document.getElementById(id),base=[['开心',['🙂','😊','😄','😁','🥰'],'#c9f341'],['平静',['😶','🙂','😌','😌','🫶'],'#a9e7ef'],['期待',['🙂','😊','😄','🤩','🤩'],'#ffd45e'],['感动',['🙂','🥹','🥹','😭','😭'],'#ffc7dc'],['疲惫',['🙂','😐','😮‍💨','😫','😵'],'#a9bce9'],['焦虑',['🙂','😕','😟','😰','😨'],'#c9b2ee'],['悲伤',['🙂','😔','😢','😭','😭'],'#86c7e5'],['愤怒',['🙂','😒','😠','😡','🤬'],'#ff8067'],['困惑',['🙂','😕','🤔','😵‍💫','😵‍💫'],'#a7b5dc'],['满足',['🙂','☺️','😌','😊','🥰'],'#b9dfa1'],['紧张',['🙂','😬','😟','😰','😨'],'#f6b884']];let selected=null,level=3,photo='',audio='',rec,chunks=[],recordId='',action='',after=0,editing='',draft={color:'#a9c8e5',eyes:'••',nose:'·',mouth:'﹏'};const opts={color:['#f7a3ae','#ffb560','#ff8067','#c9d9a9','#a9c8e5','#b8a6d8'],eyes:['••','⌒⌒','＞＜','˘˘'],nose:['','·','•'],mouth:['︶','⌣','﹏','○']},customs=()=>JSON.parse(localStorage.getItem('customMoods')||'[]'),face=m=>m.custom?'<div class="customFace" style="--c:'+m.color+'"><span class="eyes">'+m.eyes+'</span><span>'+m.nose+'</span><span class="mouth">'+m.mouth+'</span></div>':'<span class="icon" style="--c:'+m.color+'">'+m.faces[2]+'</span>';
function allMoods(){return[...base.map((x,i)=>({id:'b'+i,name:x[0],faces:x[1],color:x[2]})),...customs()]}function renderMoods(){const all=allMoods();$('moods').innerHTML=all.map(m=>'<button class="mood" style="--c:'+m.color+'" data-id="'+m.id+'">'+face(m)+'<b>'+m.name+'</b></button>').join('')+'<button class="mood add" id="add"><span class="icon" style="--c:#eee8f0">＋</span><b>自定义</b></button>';document.querySelectorAll('.mood[data-id]').forEach((b,i)=>b.onclick=()=>choose(all[i],b));$('add').onclick=()=>showBuilder()}
function choose(m,b){document.querySelectorAll('.mood').forEach(x=>x.setAttribute('aria-pressed','false'));b?.setAttribute('aria-pressed','true');selected=m;$('range').disabled=false;$('range').style.setProperty('--mood',m.color);updateCurrent()}
function updateCurrent(){if(!selected)return;const words=['一点点'+selected.name,'有些'+selected.name,'明显的'+selected.name,'很'+selected.name,'非常'+selected.name],emoji=selected.custom?'':selected.faces[level-1];$('currentFace').innerHTML=selected.custom?face(selected):emoji;$('currentFace').style.background=selected.color;$('currentFace').style.transform='scale('+(0.92+level*.025)+') rotate('+((level-3)*.5)+'deg)';$('currentFace').style.filter='saturate('+(0.75+level*.1)+')';$('currentTitle').textContent='此刻，你感到'+selected.name;$('currentCopy').textContent='让这份感受先被好好看见。';$('strengthText').textContent=words[level-1];$('range').style.setProperty('--fill',((level-1)*25)+'%')}
$('range').oninput=e=>{level=+e.target.value;updateCurrent()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')});
function read(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}$('photo').onchange=e=>{if(e.target.files[0])read(e.target.files[0],x=>{photo=x;showMedia()})};function showMedia(){$('preview').innerHTML=(photo?'<img src="'+photo+'" alt="此刻画面">':'')+(audio?'<audio controls src="'+audio+'"></audio>':'')}
$('recordBtn').onclick=async()=>{if(rec?.state==='recording'){rec.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{read(new Blob(chunks,{type:'audio/webm'}),x=>{audio=x;showMedia()});stream.getTracks().forEach(t=>t.stop());$('recordText').textContent='重新记录感受';$('recordBtn').classList.remove('recording');$('status').textContent='声音已记录'};rec.start();$('recordText').textContent='结束这段记录';$('recordBtn').classList.add('recording');$('status').textContent='正在记录，最长 60 秒';setTimeout(()=>rec?.state==='recording'&&rec.stop(),60000)}catch(e){$('status').textContent='请允许浏览器使用麦克风'}};
const plansFor=n=>['焦虑','紧张'].includes(n)?[['一分钟呼吸','跟着节奏放慢呼气。'],['舒缓声音','听五分钟低刺激环境音。'],['脚踩地面','感受双脚与地面的接触。']]:['疲惫','悲伤'].includes(n)?[['身体扫描','用三分钟留意身体需要什么。'],['轻柔伸展','活动肩颈，再喝一点水。'],['联系朋友','给可信任的人发一句问候。']]:[['收藏这一刻','写下一件值得记住的小事。'],['散步五分钟','带着这份感受去看看窗外。'],['分享快乐','把此刻告诉一个重要的人。']];
$('saveBtn').onclick=()=>{if(!selected){$('error').textContent='请先选择一种情绪。';return}$('error').textContent='';const trigger=[...document.querySelectorAll('.chip')].find(x=>x.getAttribute('aria-pressed')==='true')?.textContent||'未选择',ps=plansFor(selected.name),r={id:'r'+Date.now(),mood:selected.name,face:selected.custom?'':selected.faces[level-1],customFace:selected.custom?selected:null,color:selected.color,level,trigger,note:$('note').value.trim(),timestamp:new Date().toISOString(),photo,audio,plan:{actions:ps.map(x=>({name:x[0],text:x[1]}))},feedback:[]};let d=JSON.parse(localStorage.getItem('moodRecords')||'[]');d.unshift(r);try{localStorage.setItem('moodRecords',JSON.stringify(d.slice(0,30)))}catch(e){r.photo=r.audio='';localStorage.setItem('moodRecords',JSON.stringify(d.slice(0,30)))}recordId=r.id;$('careTitle').textContent=selected.name+'时，可以先做一件小事';$('careText').textContent='选择一个适合当下的方案，不需要全部完成。';$('plans').innerHTML=ps.map(x=>'<article class="plan"><h3>'+x[0]+'</h3><p>'+x[1]+'</p><button class="btn done" data-a="'+x[0]+'">我完成了</button></article>').join('');document.querySelectorAll('.done').forEach(b=>b.onclick=()=>{action=b.dataset.a;$('feedbackAction').textContent='行动方案：'+action;$('feedback').classList.add('show')});$('care').classList.add('show');$('care').scrollIntoView({behavior:'smooth'})};
document.querySelectorAll('.rate').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.rate').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');after=i+1});$('closeFeedback').onclick=()=>$('feedback').classList.remove('show');$('saveFeedback').onclick=()=>{if(!after)return;let d=JSON.parse(localStorage.getItem('moodRecords')||'[]'),r=d.find(x=>x.id===recordId);if(r){r.feedback.push({action,afterLevel:after,change:$('change').value,note:$('feedbackNote').value.trim(),completedAt:new Date().toISOString()});localStorage.setItem('moodRecords',JSON.stringify(d))}$('feedback').classList.remove('show');let b=[...document.querySelectorAll('.done')].find(x=>x.dataset.a===action);if(b){b.textContent='已完成';b.classList.add('ok')}};
function showBuilder(id=''){editing=id;let m=id?customs().find(x=>x.id===id):null;if(m){Object.assign(draft,m);$('moodName').value=m.name}else{$('moodName').value=''}$('pickerView').style.display='none';$('builder').classList.add('show');renderBuilder()}$('back').onclick=()=>{$('builder').classList.remove('show');$('pickerView').style.display='block'};
function renderBuilder(){$('builderPreview').innerHTML=face({...draft,custom:true});$('colors').innerHTML=opts.color.map(v=>'<button class="swatch '+(draft.color===v?'activePart':'')+'" style="background:'+v+'" data-k="color" data-v="'+v+'"></button>').join('');[['eyes','eyes'],['noses','nose'],['mouths','mouth']].forEach(([id,k])=>$(id).innerHTML=opts[k].map(v=>'<button class="part '+(draft[k]===v?'activePart':'')+'" data-k="'+k+'" data-v="'+v+'">'+(v||'无')+'</button>').join(''));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{draft[b.dataset.k]=b.dataset.v;renderBuilder()});$('customList').innerHTML=customs().map(m=>'<div class="customItem"><span>'+m.name+'</span><span><button onclick="showBuilder(\''+m.id+'\')">编辑</button> <button onclick="delMood(\''+m.id+'\')">删除</button></span></div>').join('')}
$('saveMood').onclick=()=>{if(!$('moodName').value.trim())return;let d=customs(),m={id:editing||'c'+Date.now(),name:$('moodName').value.trim(),custom:true,...draft};d=editing?d.map(x=>x.id===editing?m:x):[...d,m];localStorage.setItem('customMoods',JSON.stringify(d));$('builder').classList.remove('show');$('pickerView').style.display='block';renderMoods()};function delMood(id){localStorage.setItem('customMoods',JSON.stringify(customs().filter(x=>x.id!==id)));renderBuilder();renderMoods()}renderMoods();
</script><script>document.querySelector('.actions .secondary')?.remove();document.getElementById('saveBtn').textContent='存下此刻';</script></body></html>
