<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>心晴 · 记录此刻</title>
<style>
:root{--bg:#edf3f0;--panel:#f9fbfa;--soft:#e3ede8;--ink:#173029;--muted:#63756e;--line:#cbd9d2;--brand:#1d654f;--brand2:#154b3b;--danger:#a6424a;--shadow:0 22px 60px rgba(24,72,57,.12)}@media(prefers-color-scheme:dark){:root{--bg:#101916;--panel:#17231f;--soft:#20312b;--ink:#edf5f1;--muted:#a9b9b2;--line:#334840;--brand:#70c3a7;--brand2:#2d7961;--danger:#f29aa0;--shadow:0 24px 64px rgba(0,0,0,.28)}}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.5}.shell{width:min(1040px,calc(100% - 32px));margin:auto;min-height:100dvh;padding:22px 0 42px}.top{height:56px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:800;letter-spacing:-.03em}.nav{display:flex;gap:8px}.nav a{text-decoration:none;color:var(--muted);font-size:14px;padding:9px 12px;border-radius:10px}.nav a.active{background:var(--soft);color:var(--ink);font-weight:700}.intro{padding:42px 0 22px}.intro h1{font-size:clamp(34px,5vw,54px);line-height:1.06;letter-spacing:-.045em;margin:0 0 12px}.intro p{font-size:17px;color:var(--muted);margin:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.main{padding:30px}.eyebrow{margin:0 0 8px;color:var(--brand);font-size:13px;font-weight:800}.main h2{font-size:clamp(24px,3.5vw,38px);letter-spacing:-.035em;margin:0}.hint{color:var(--muted);margin:8px 0 24px}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.mood{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:17px 7px;cursor:pointer;transition:.18s ease}.mood:hover{transform:translateY(-2px);border-color:var(--brand)}.mood[aria-pressed="true"]{background:var(--soft);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.face{display:block;font-size:29px;margin-bottom:6px}.name{font-size:14px;font-weight:750}.strength{display:flex;align-items:center;gap:12px;margin-top:20px}.strength label,.label{font-size:13px;font-weight:750}.strength input{width:min(300px,55vw);accent-color:var(--brand)}output{color:var(--brand);font-weight:800}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.label{display:block;margin-bottom:8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px 12px;cursor:pointer}.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--brand);color:var(--ink)}textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--ink);padding:12px 13px;font:inherit;resize:vertical;outline:none}textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}.error{min-height:18px;color:var(--danger);font-size:13px;margin:10px 0 0}.actions{display:flex;justify-content:flex-end;gap:10px;padding:17px 22px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,var(--brand) 6%)}.btn{border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:780;cursor:pointer;white-space:nowrap}.btn:active{transform:scale(.98)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.primary{background:var(--brand2);color:#f4fbf8}.care{display:none;margin-top:22px}.care.show{display:block}.care-head{margin-bottom:14px}.care-head h2{font-size:30px;letter-spacing:-.035em;margin:5px 0}.care-head p{color:var(--muted);max-width:700px;margin:0}.plans{display:grid;grid-template-columns:1fr 1fr;gap:14px}.plan{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:21px}.plan-tag{font-size:12px;color:var(--brand);font-weight:800}.plan h3{font-size:19px;margin:7px 0}.plan p{color:var(--muted);font-size:14px;min-height:44px}.plan-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.duration{font-size:13px;color:var(--muted)}.done{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.done.completed{background:var(--brand2);color:#f4fbf8}.legal{font-size:12px;color:var(--muted);text-align:center;margin-top:34px}.modal{position:fixed;inset:0;background:rgba(4,13,10,.62);display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:25px;box-shadow:var(--shadow)}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog h2{margin:0;font-size:25px}.close{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.rate{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:11px;padding:12px 4px;cursor:pointer}.rate[aria-pressed="true"]{background:var(--soft);border-color:var(--brand)}select{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);padding:11px;font:inherit}.dialog textarea{margin-top:13px}.dialog-actions{display:flex;justify-content:flex-end;margin-top:15px}.small{font-size:13px;color:var(--muted)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media(max-width:720px){.shell{width:min(100% - 22px,1040px)}.intro{padding:28px 3px 17px}.main{padding:21px 15px}.moods{grid-template-columns:repeat(5,minmax(58px,1fr));gap:7px;overflow-x:auto}.name{font-size:12px}.details,.plans{grid-template-columns:1fr}.actions{padding:13px;flex-wrap:wrap}.actions .btn{flex:1}.privacy{display:none}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">心晴</div><nav class="nav"><a class="active" href="index.html">记录此刻</a><a href="trends.html">情绪日历</a></nav></header>
<section class="intro"><h1>此刻，你最接近哪种感受？</h1><p>不需要组织好语言。先选一个感受，再慢慢看见它。</p></section>
<section class="panel"><div class="main"><p class="eyebrow">感受当下</p><h2>选一个最接近的情绪</h2><p class="hint">情绪没有对错，如实选择就好。</p>
<div class="moods" role="group" aria-label="选择情绪"><button class="mood" data-mood="平静" data-face="😌" aria-pressed="false"><span class="face">😌</span><span class="name">平静</span></button><button class="mood" data-mood="愉快" data-face="🙂" aria-pressed="false"><span class="face">🙂</span><span class="name">愉快</span></button><button class="mood" data-mood="疲惫" data-face="😐" aria-pressed="false"><span class="face">😐</span><span class="name">疲惫</span></button><button class="mood" data-mood="焦虑" data-face="😟" aria-pressed="false"><span class="face">😟</span><span class="name">焦虑</span></button><button class="mood" data-mood="低落" data-face="😣" aria-pressed="false"><span class="face">😣</span><span class="name">低落</span></button></div>
<div class="strength"><label for="level">情绪强度</label><input id="level" type="range" min="1" max="5" value="3"><output id="levelOut">3 / 5</output></div>
<div class="details"><div><span class="label">可能的触发因素</span><div class="chips"><button class="chip" aria-pressed="false">学业</button><button class="chip" aria-pressed="false">工作</button><button class="chip" aria-pressed="false">关系</button><button class="chip" aria-pressed="false">身体状态</button><button class="chip" aria-pressed="false">说不清</button></div></div><div><label class="label" for="note">想补充的一句话</label><textarea id="note" maxlength="180" placeholder="例如：今天开会时，我一直担心自己表现不好"></textarea></div></div><p class="error" id="error" role="alert"></p></div>
<div class="actions"><button class="btn secondary" onclick="location.href='trends.html'">查看情绪趋势</button><button class="btn primary" id="saveBtn">记录此刻</button></div></section>
<section class="care" id="care" aria-live="polite"><div class="care-head"><span class="eyebrow">记录完成 · 给此刻的你</span><h2 id="careTitle">先照顾当下</h2><p id="careText"></p></div><div class="plans"><article class="plan"><span class="plan-tag">稳定身体</span><h3 id="planOneTitle">一分钟呼吸</h3><p id="planOneText"></p><div class="plan-foot"><span class="duration">约 1 分钟</span><button class="btn done" data-action="一分钟呼吸">我完成了</button></div></article><article class="plan"><span class="plan-tag">微小行动</span><h3 id="planTwoTitle">只做下一步</h3><p id="planTwoText"></p><div class="plan-foot"><span class="duration">约 3 分钟</span><button class="btn done" data-action="微小行动">我完成了</button></div></article></div></section>
<p class="legal">心晴不是医疗服务。如有伤害自己或他人的念头，请立即联系当地紧急援助或可信任的人。</p></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle"><div class="dialog"><div class="dialog-head"><h2 id="feedbackTitle">做完后，感觉如何？</h2><button class="close" id="closeBtn">关闭</button></div><p class="small" id="feedbackAction"></p><span class="label">现在的情绪强度</span><div class="rating" id="rating"><button class="rate" aria-pressed="false">1</button><button class="rate" aria-pressed="false">2</button><button class="rate" aria-pressed="false">3</button><button class="rate" aria-pressed="false">4</button><button class="rate" aria-pressed="false">5</button></div><label class="label" for="change">和刚才相比</label><select id="change"><option>更轻松了</option><option>有一点改善</option><option>暂时没变化</option><option>感觉更难受</option></select><textarea id="feedbackNote" maxlength="160" placeholder="可以写下身体或情绪发生了什么变化"></textarea><div class="dialog-actions"><button class="btn primary" id="feedbackSave">保存反馈</button></div></div></div>
<script>
const $=id=>document.getElementById(id),moods=[...document.querySelectorAll('.mood')],chips=[...document.querySelectorAll('.chip')],rates=[...document.querySelectorAll('.rate')];let selected=null,currentRecordId=null,currentAction=null,afterLevel=null;
moods.forEach(b=>b.onclick=()=>{moods.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');selected={mood:b.dataset.mood,face:b.dataset.face};$('error').textContent=''});chips.forEach(b=>b.onclick=()=>{chips.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')});$('level').oninput=()=>$('levelOut').value=$('level').value+' / 5';
const plans={平静:['延续这份稳定','用一分钟留意呼吸，不需要刻意改变。','写下一件今天值得期待的小事。'],愉快:['收藏这一刻','慢慢呼吸，记住身体此刻轻松的位置。','给带来愉快的人发一句感谢。'],疲惫:['先恢复一点能量','吸气 4 秒，呼气 6 秒，重复 5 轮。','离开屏幕，补水并伸展肩颈。'],焦虑:['先让身体慢下来','吸气 4 秒，停留 2 秒，呼气 6 秒，重复 5 轮。','写下眼前唯一可以完成的小步骤。'],低落:['给自己一点陪伴','把手放在胸口，进行 5 次缓慢呼吸。','联系一个可信任的人，说说今天的状态。']};
$('saveBtn').onclick=()=>{if(!selected){$('error').textContent='请先选择一个最接近的情绪。';return}const trigger=chips.find(x=>x.getAttribute('aria-pressed')==='true')?.textContent||'未选择',p=plans[selected.mood],record={id:'r'+Date.now(),mood:selected.mood,face:selected.face,level:Number($('level').value),trigger,note:$('note').value.trim(),timestamp:new Date().toISOString(),plan:{title:p[0],actions:[{name:'一分钟呼吸',text:p[1]},{name:'微小行动',text:p[2]}]},feedback:[]};const data=JSON.parse(localStorage.getItem('moodRecords')||'[]');data.unshift(record);localStorage.setItem('moodRecords',JSON.stringify(data.slice(0,50)));currentRecordId=record.id;$('careTitle').textContent=p[0];$('careText').textContent=trigger==='未选择'?'根据你记录的情绪，先从一个轻量行动开始。':'你记录的触发因素是“'+trigger+'”。先从一个轻量行动开始。';$('planOneText').textContent=p[1];$('planTwoText').textContent=p[2];$('care').classList.add('show');$('care').scrollIntoView({behavior:'smooth'});$('saveBtn').textContent='已记录'};
document.querySelectorAll('.done').forEach(b=>b.onclick=()=>{if(!currentRecordId)return;currentAction=b.dataset.action;$('feedbackAction').textContent='行动方案：'+currentAction;rates.forEach(x=>x.setAttribute('aria-pressed','false'));afterLevel=null;$('modal').classList.add('show')});rates.forEach((b,i)=>b.onclick=()=>{rates.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');afterLevel=i+1});$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
$('feedbackSave').onclick=()=>{if(!afterLevel){$('feedbackAction').textContent='请选择现在的情绪强度。';return}const data=JSON.parse(localStorage.getItem('moodRecords')||'[]'),r=data.find(x=>x.id===currentRecordId);if(r){r.feedback=r.feedback||[];r.feedback.push({action:currentAction,completedAt:new Date().toISOString(),afterLevel,change:$('change').value,note:$('feedbackNote').value.trim()});localStorage.setItem('moodRecords',JSON.stringify(data))}const btn=[...document.querySelectorAll('.done')].find(x=>x.dataset.action===currentAction);if(btn){btn.textContent='已完成';btn.classList.add('completed')}$('modal').classList.remove('show');$('feedbackNote').value=''};
</script></body></html>
