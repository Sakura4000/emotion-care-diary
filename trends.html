<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心晴 · 情绪日历</title>
<style>
:root{--bg:#edf3f0;--panel:#f9fbfa;--soft:#e3ede8;--ink:#173029;--muted:#63756e;--line:#cbd9d2;--brand:#1d654f;--brand2:#154b3b;--shadow:0 22px 60px rgba(24,72,57,.12)}@media(prefers-color-scheme:dark){:root{--bg:#101916;--panel:#17231f;--soft:#20312b;--ink:#edf5f1;--muted:#a9b9b2;--line:#334840;--brand:#70c3a7;--brand2:#2d7961;--shadow:0 24px 64px rgba(0,0,0,.28)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;line-height:1.5}.shell{width:min(1180px,calc(100% - 30px));margin:auto;min-height:100dvh;padding:22px 0 42px}.top{height:56px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:800}.nav{display:flex;gap:8px}.nav a{text-decoration:none;color:var(--muted);font-size:14px;padding:9px 12px;border-radius:10px}.nav a.active{background:var(--soft);color:var(--ink);font-weight:700}.head{display:flex;justify-content:space-between;align-items:end;padding:40px 0 22px}.head h1{font-size:clamp(34px,5vw,52px);letter-spacing:-.045em;margin:0 0 8px}.head p{color:var(--muted);margin:0}.month-nav{display:flex;align-items:center;gap:10px}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}.month{font-weight:800;min-width:118px;text-align:center}.calendar{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{padding:12px;text-align:center;color:var(--muted);font-size:12px;font-weight:800;border-bottom:1px solid var(--line)}.day{min-height:132px;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day:nth-child(7n){border-right:0}.day.out{opacity:.38}.date{font-size:12px;color:var(--muted);margin-bottom:8px}.today .date{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand2);color:#f4fbf8}.events{display:grid;gap:5px}.event{border:0;border-radius:9px;background:var(--soft);color:var(--ink);padding:6px 7px;text-align:left;cursor:pointer;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.event:hover{outline:1px solid var(--brand)}.sample{margin-left:4px;color:var(--muted);font-size:10px}.legend{display:flex;gap:16px;align-items:center;margin-top:14px;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:rgba(4,13,10,.62);display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{width:min(620px,100%);max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:25px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;align-items:start}.dialog h2{font-size:27px;margin:0}.close{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}.meta{color:var(--muted);font-size:13px;margin-top:5px}.section{padding-top:18px;margin-top:18px;border-top:1px solid var(--line)}.section h3{font-size:14px;margin:0 0 9px}.quote{background:var(--soft);border-radius:12px;padding:13px;margin:0}.feedback{display:grid;gap:9px}.feedback-item{border:1px solid var(--line);border-radius:12px;padding:12px}.feedback-item strong{display:block}.feedback-item span{color:var(--muted);font-size:13px}.empty{color:var(--muted)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:760px){.head{display:block;padding-top:26px}.month-nav{margin-top:18px}.calendar{overflow-x:auto}.week,.grid{min-width:760px}.day{min-height:120px}.legend{flex-wrap:wrap}}
</style></head><body><main class="shell"><header class="top"><div class="brand">心晴</div><nav class="nav"><a href="index.html">记录此刻</a><a class="active" href="trends.html">情绪日历</a></nav></header><section class="head"><div><h1>情绪日历</h1><p>回看情绪出现的时刻，以及哪些行动真正帮到了你。</p></div><div class="month-nav"><button class="icon-btn" id="prev" aria-label="上个月">←</button><div class="month" id="month"></div><button class="icon-btn" id="next" aria-label="下个月">→</button></div></section><section class="calendar"><div class="week"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div></div><div class="grid" id="grid"></div></section><div class="legend"><span>点击具体时刻查看完整记录</span><span>示例数据仅用于演示</span></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="dialog"><div class="dialog-head"><div><h2 id="detailTitle"></h2><div class="meta" id="detailMeta"></div></div><button class="close" id="close">关闭</button></div><section class="section"><h3>当时发生了什么</h3><p class="quote" id="detailNote"></p></section><section class="section"><h3>推荐的行动方案</h3><p id="detailPlan"></p></section><section class="section"><h3>执行与效果反馈</h3><div class="feedback" id="detailFeedback"></div></section></div></div>
<script>
const $=id=>document.getElementById(id);let cursor=new Date();cursor.setDate(1);const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function mockData(){const y=cursor.getFullYear(),m=cursor.getMonth(),mk=(day,hour,min,mood,face,level,trigger,note,action,after,change,feedback)=>({id:'sample-'+day+'-'+hour,isSample:true,mood,face,level,trigger,note,timestamp:new Date(y,m,day,hour,min).toISOString(),plan:{title:'给此刻的你',actions:[{name:action,text:action}]},feedback:after?[{action,afterLevel:after,change,note:feedback,completedAt:new Date(y,m,day,hour,min+12).toISOString()}]:[]});return[mk(3,9,20,'焦虑','😟',4,'工作','早会前一直担心自己表达不好。','一分钟呼吸',2,'更轻松了','呼吸变慢后，没有那么慌了。'),mk(3,21,35,'平静','😌',2,'关系','和朋友聊完以后轻松了一些。','写下感谢',1,'有一点改善','写完后更珍惜这段关系。'),mk(8,14,10,'疲惫','😐',4,'身体状态','午后注意力很难集中。','补水和伸展',3,'有一点改善','肩颈放松了一点。'),mk(12,22,5,'低落','😣',4,'关系','今天很想念一个很久没联系的人。','联系可信任的人',3,'有一点改善','发出消息后感觉没那么孤单。'),mk(18,10,40,'愉快','🙂',2,'工作','完成了拖了很久的任务。','收藏这一刻',1,'更轻松了','把这件事记下来很有成就感。'),mk(24,16,25,'焦虑','😟',5,'学业','临近截止日期，不知道从哪里开始。','只做下一步',3,'有一点改善','列出第一步后开始动起来了。')]}
function records(){let user=[];try{user=JSON.parse(localStorage.getItem('moodRecords')||'[]')}catch(e){}return[...user,...mockData()].map(r=>{if(!r.timestamp&&r.time){r.timestamp=new Date(r.time).toISOString()}return r}).filter(r=>r.timestamp&&!Number.isNaN(new Date(r.timestamp).getTime()))}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth();$('month').textContent=y+' 年 '+(m+1)+' 月';const first=(new Date(y,m,1).getDay()+6)%7,start=new Date(y,m,1-first),all=records();$('grid').innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='day'+(d.getMonth()!==m?' out':'')+(key(d)===key(new Date())?' today':'');cell.innerHTML='<div class="date">'+d.getDate()+'</div><div class="events"></div>';const events=all.filter(r=>key(new Date(r.timestamp))===key(d)).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));events.forEach(r=>{const t=new Date(r.timestamp),b=document.createElement('button');b.className='event';b.innerHTML=pad(t.getHours())+':'+pad(t.getMinutes())+' '+r.face+' '+r.mood+(r.isSample?'<span class="sample">示例</span>':'');b.onclick=()=>openDetail(r);cell.querySelector('.events').appendChild(b)});$('grid').appendChild(cell)}}
function openDetail(r){const d=new Date(r.timestamp);$('detailTitle').textContent=r.face+' '+r.mood+' · '+r.level+'/5';$('detailMeta').textContent=d.toLocaleString('zh-CN')+' · 触发因素：'+(r.trigger||'未选择')+(r.isSample?' · 示例记录':'');$('detailNote').textContent=r.note||'当时没有补充文字。';const acts=r.plan?.actions||[];$('detailPlan').textContent=acts.length?acts.map(x=>x.name+'：'+x.text).join('；'):'当时没有保存行动方案。';const fb=r.feedback||[];$('detailFeedback').innerHTML=fb.length?fb.map(x=>'<div class="feedback-item"><strong>'+x.action+' · 已完成</strong><span>调节后强度 '+x.afterLevel+'/5 · '+x.change+'</span><p>'+(x.note||'没有补充感受。')+'</p></div>').join(''):'<p class="empty">行动方案暂未完成，或尚未填写效果反馈。</p>';$('modal').classList.add('show')}
$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show')});render();
</script></body></html>
