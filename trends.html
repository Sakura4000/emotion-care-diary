<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心晴 · 情绪趋势</title><style>
:root{--bg:#f2e8f5;--panel:#fff;--ink:#19161c;--muted:#716a75;--line:#e9e3eb;--lime:#d9f44c;--pink:#f4cdf4;--blue:#c9edf5;--shadow:0 22px 60px #563f6017}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Segoe UI","PingFang SC",sans-serif}.shell{width:min(1120px,calc(100% - 30px));margin:auto;padding:20px 0 45px}.top{height:58px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.nav{display:flex;gap:8px}.nav a{text-decoration:none;color:var(--muted);padding:9px 13px;border-radius:999px}.nav a.active{background:#fff;color:var(--ink);font-weight:800}.hero{display:flex;align-items:end;justify-content:space-between;padding:36px 0 20px}.hero h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.05em;margin:0 0 8px}.hero p{color:var(--muted);margin:0}.tabs{display:flex;gap:8px}.tab,.iconBtn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer}.tab[aria-pressed=true]{background:var(--lime);border-color:transparent}.view{display:none}.view.show{display:block}.panel{background:#fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.monthHead{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.monthNav{display:flex;align-items:center;gap:10px}.month{min-width:120px;text-align:center;font-weight:900}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:11px;color:var(--muted);font-size:12px;font-weight:850;border-bottom:1px solid var(--line)}.day{min-height:120px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day:nth-child(7n){border-right:0}.day.out{opacity:.3}.date{font-size:12px;color:var(--muted);margin-bottom:7px}.today .date{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--lime);color:var(--ink);font-weight:900}.events{display:grid;gap:5px}.event{border:0;border-radius:9px;padding:6px 7px;text-align:left;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sample{font-size:9px;opacity:.65}.annual{padding:24px}.annualHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.annualHead h2{margin:0;font-size:27px}.yearNav{display:flex;gap:9px;align-items:center}.year{min-width:70px;text-align:center;font-weight:900}.heatWrap{overflow:auto;padding-bottom:8px}.months{display:grid;grid-template-columns:repeat(12,1fr);min-width:780px;color:var(--muted);font-size:11px;margin:0 0 7px 28px}.heatRow{display:flex;gap:7px;min-width:800px}.weekLabels{width:21px;display:grid;grid-template-rows:repeat(7,13px);gap:4px;font-size:9px;color:var(--muted)}.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:4px}.cell{width:13px;height:13px;border-radius:4px;background:#f0edf1;position:relative}.cell:hover{outline:2px solid #1b181d}.statsTitle{margin:28px 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#faf8fb;border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px}.statFace{width:47px;height:47px;border-radius:15px;display:grid;place-items:center;font-size:25px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.legend{display:flex;gap:10px;align-items:center;margin-top:16px;color:var(--muted);font-size:12px}.dot{width:12px;height:12px;border-radius:4px}.modal{position:fixed;inset:0;background:#21172380;display:none;place-items:center;padding:18px;z-index:5}.modal.show{display:grid}.dialog{width:min(650px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:24px}.dialogHead{display:flex;justify-content:space-between;align-items:start}.dialog h2{font-size:27px;margin:0}.close{border:0;background:#f4eff5;border-radius:9px;padding:8px;cursor:pointer}.meta{color:var(--muted);font-size:13px;margin-top:6px}.section{padding-top:17px;margin-top:17px;border-top:1px solid var(--line)}.section h3{font-size:14px;margin:0 0 9px}.quote,.feedbackItem{background:#f8f5f9;border-radius:13px;padding:13px}.feedbackItem{margin-top:8px}.feedbackItem span{color:var(--muted);font-size:13px}.media{display:flex;gap:10px;flex-wrap:wrap}.media img{width:min(260px,100%);max-height:190px;object-fit:cover;border-radius:13px}.media audio{width:min(320px,100%)}.empty{color:var(--muted)}@media(max-width:760px){.hero{display:block;padding-top:24px}.tabs{margin-top:18px}.calendar{overflow:auto}.week,.grid{min-width:760px}.stats{grid-template-columns:1fr 1fr}.annual{padding:18px 14px}.nav a{padding:8px}}
</style></head><body><main class="shell"><header class="top"><b class="brand">心晴</b><nav class="nav"><a href="index.html">记录此刻</a><a class="active" href="trends.html">情绪趋势</a></nav></header><section class="hero"><div><h1>看见情绪的轨迹</h1><p>不是给自己打分，而是慢慢认出什么在影响你。</p></div><div class="tabs"><button class="tab" data-view="monthView" aria-pressed="true">月历记录</button><button class="tab" data-view="yearView">年度热力图</button></div></section>
<section class="view show" id="monthView"><div class="panel calendar"><div class="monthHead"><b>每天的情绪时刻</b><div class="monthNav"><button class="iconBtn" id="prevMonth">←</button><div class="month" id="month"></div><button class="iconBtn" id="nextMonth">→</button></div></div><div class="week"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div><div>周日</div></div><div class="grid" id="grid"></div></div></section>
<section class="view" id="yearView"><div class="panel annual"><div class="annualHead"><h2>年度心情热力图</h2><div class="yearNav"><button class="iconBtn" id="prevYear">←</button><div class="year" id="year"></div><button class="iconBtn" id="nextYear">→</button></div></div><div class="heatWrap"><div class="months"><span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span><span>7月</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span></div><div class="heatRow"><div class="weekLabels"><i></i><span>一</span><i></i><span>三</span><i></i><span>五</span><i></i></div><div class="heat" id="heat"></div></div></div><div class="legend"><span>每格代表一天</span><span class="dot" style="background:#c9f341"></span>积极<span class="dot" style="background:#c9edf5"></span>平稳<span class="dot" style="background:#c9b2ee"></span>低落或焦虑<span class="dot" style="background:#ff8067"></span>紧绷</div><h3 class="statsTitle">这一年的情绪出现次数</h3><div class="stats" id="stats"></div></div></section><p class="legend">页面含示例记录，点击月历中的具体时刻可查看行动方案与完成反馈。</p></main>
<div class="modal" id="modal"><div class="dialog"><div class="dialogHead"><div><h2 id="detailTitle"></h2><div class="meta" id="detailMeta"></div></div><button class="close" id="close">关闭</button></div><section class="section"><h3>当时发生了什么</h3><p class="quote" id="detailNote"></p><div class="media" id="detailMedia"></div></section><section class="section"><h3>推荐的行动方案</h3><p id="detailPlan"></p></section><section class="section"><h3>执行与效果反馈</h3><div id="detailFeedback"></div></section></div></div>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());let cursor=new Date(),yearCursor=cursor.getFullYear();cursor.setDate(1);const colors={开心:'#c9f341',平静:'#a9e7ef',期待:'#ffd45e',感动:'#ffc7dc',疲惫:'#a9bce9',焦虑:'#c9b2ee',悲伤:'#86c7e5',愤怒:'#ff8067',困惑:'#a7b5dc',满足:'#b9dfa1',紧张:'#f6b884'};
function mockData(y=cursor.getFullYear(),m=cursor.getMonth()){const mk=(day,hour,mood,face,color,level,trigger,note,action,after,change)=>({id:'sample-'+y+'-'+m+'-'+day+'-'+hour,isSample:true,mood,face,color,level,trigger,note,timestamp:new Date(y,m,day,hour,20).toISOString(),plan:{actions:[{name:action,text:action}]},feedback:after?[{action,afterLevel:after,change,note:'做完后身体和注意力都有了一点变化。'}]:[]});return[mk(3,9,'焦虑','😟',colors.焦虑,4,'工作','早会前一直担心自己表达不好。','一分钟呼吸',2,'更轻松了'),mk(3,21,'平静','😌',colors.平静,2,'关系','和朋友聊完以后轻松了一些。','写下感谢',1,'有一点改善'),mk(8,14,'疲惫','😫',colors.疲惫,4,'身体状态','午后注意力很难集中。','补水和伸展',3,'有一点改善'),mk(12,22,'悲伤','😢',colors.悲伤,4,'关系','今天很想念一个很久没联系的人。','联系可信任的人',3,'有一点改善'),mk(18,10,'开心','😊',colors.开心,2,'工作','完成了拖了很久的任务。','收藏这一刻',1,'更轻松了'),mk(24,16,'紧张','😬',colors.紧张,5,'学业','临近截止日期，不知道从哪里开始。','只做下一步',3,'有一点改善')]}
function stored(){try{return JSON.parse(localStorage.getItem('moodRecords')||'[]')}catch(e){return[]}}function recordsFor(y,m){return[...stored(),...mockData(y,m)].filter(r=>r.timestamp&&!Number.isNaN(new Date(r.timestamp).getTime()))}function colorOf(r){return r.color||colors[r.mood]||'#d9d1dc'}
function renderMonth(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,start=new Date(y,m,1-first),all=recordsFor(y,m);$('month').textContent=y+' 年 '+(m+1)+' 月';$('grid').innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const cell=document.createElement('div');cell.className='day'+(d.getMonth()!==m?' out':'')+(dateKey(d)===dateKey(new Date())?' today':'');cell.innerHTML='<div class="date">'+d.getDate()+'</div><div class="events"></div>';all.filter(r=>dateKey(new Date(r.timestamp))===dateKey(d)).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)).forEach(r=>{const t=new Date(r.timestamp),b=document.createElement('button');b.className='event';b.style.background=colorOf(r)+'55';b.innerHTML=pad(t.getHours())+':'+pad(t.getMinutes())+' '+(r.face||r.icon||'●')+' '+r.mood+(r.isSample?' <span class="sample">示例</span>':'');b.onclick=()=>openDetail(r);cell.querySelector('.events').appendChild(b)});$('grid').appendChild(cell)}}
function annualRecords(y){let data=stored().filter(r=>new Date(r.timestamp).getFullYear()===y);for(let m=0;m<12;m++)data.push(...mockData(y,m));return data}function renderYear(){const all=annualRecords(yearCursor),start=new Date(yearCursor,0,1),offset=(start.getDay()+6)%7,end=new Date(yearCursor,11,31);$('year').textContent=yearCursor;$('heat').innerHTML='';for(let i=0;i<offset;i++)$('heat').appendChild(Object.assign(document.createElement('i'),{className:'cell'}));for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const day=new Date(d),rs=all.filter(r=>dateKey(new Date(r.timestamp))===dateKey(day)),c=document.createElement('button');c.className='cell';c.title=day.toLocaleDateString('zh-CN')+(rs.length?' · '+rs.map(r=>r.mood).join('、'):' · 暂无记录');if(rs.length)c.style.background=colorOf(rs[rs.length-1]);c.onclick=()=>{if(rs.length){cursor=new Date(day.getFullYear(),day.getMonth(),1);document.querySelector('[data-view="monthView"]').click();renderMonth()}};$('heat').appendChild(c)}const count={};all.forEach(r=>count[r.mood]=(count[r.mood]||0)+1);$('stats').innerHTML=Object.entries(count).sort((a,b)=>b[1]-a[1]).map(([name,n])=>{const r=all.find(x=>x.mood===name);return '<article class="stat"><span class="statFace" style="background:'+colorOf(r)+'">'+(r.face||r.icon||'●')+'</span><div><b>'+n+' 次</b><small>'+name+'</small></div></article>'}).join('')||'<p class="empty">这一年还没有记录。</p>'}
function openDetail(r){const d=new Date(r.timestamp);$('detailTitle').textContent=(r.face||r.icon||'●')+' '+r.mood+' · '+r.level+'/5';$('detailMeta').textContent=d.toLocaleString('zh-CN')+' · 触发因素：'+(r.trigger||'未选择')+(r.isSample?' · 示例记录':'');$('detailNote').textContent=r.note||'当时没有补充文字。';$('detailMedia').innerHTML=(r.photo?'<img src="'+r.photo+'" alt="当时上传的场景图片">':'')+(r.audio?'<audio controls src="'+r.audio+'"></audio>':'');$('detailPlan').textContent=(r.plan?.actions||[]).map(x=>x.name+'：'+x.text).join('；')||'当时没有保存行动方案。';const fb=r.feedback||[];$('detailFeedback').innerHTML=fb.length?fb.map(x=>'<article class="feedbackItem"><b>'+x.action+' · 已完成</b><br><span>调节后强度 '+x.afterLevel+'/5 · '+x.change+'</span><p>'+(x.note||'没有补充感受。')+'</p></article>').join(''):'<p class="empty">行动方案暂未完成，或尚未填写效果反馈。</p>';$('modal').classList.add('show')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed','false'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));b.setAttribute('aria-pressed','true');$(b.dataset.view).classList.add('show');if(b.dataset.view==='yearView')renderYear()});$('prevMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);renderMonth()};$('nextMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);renderMonth()};$('prevYear').onclick=()=>{yearCursor--;renderYear()};$('nextYear').onclick=()=>{yearCursor++;renderYear()};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show')});renderMonth();
</script></body></html>
